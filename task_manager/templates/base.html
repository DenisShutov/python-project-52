{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    {% bootstrap_css %} 
    {% bootstrap_javascript %}
</head>
<body>
    <header>
        <nav class="py-2 bg-body-tertiary border-bottom"> 
            <div class="d-flex flex-wrap justify-content-start"> 
                <ul class="nav me-auto"> 
                    <li class="nav-item">
                        <a href="{% url 'index' %}" class="nav-link link-body-emphasis px-2 active" aria-current="page">Менеджер задач</a>
                    </li> 
                    <li class="nav-item">
                        <a href="{% url 'users_list' %}" class="nav-link link-body-emphasis px-2">Пользователи</a>
                    </li> 
                    <li class="nav-item">
                        <a href="{% url 'login' %}" class="nav-link link-body-emphasis px-2">Вход</a>
                    </li> 
                    <li class="nav-item">
                        <a href="{% url 'users_create' %}" class="nav-link link-body-emphasis px-2">Регистрация</a>
                    </li>
                    
                 </ul>
            </div> 
        </nav>       
    </header>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}
    {% block content %}
    {% endblock %}
</body>
</html>
