{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="container mt-4">
    <h2>Статусы</h2>
    <a href="{% url 'statuses_create' %}" class="btn btn-primary">Создать статус</a>
    <table class="table table-striped"> 
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Дата создания</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for status in statuses %}
            <tr>
                <td>{{status.id}}</td>
                <td>{{status.name}}</td>
                <td>{{status.created_at|date:"d.m.Y H:i"}}</td>
                <td>
                    <a href="{% url 'statuses_update' status.id %}" class="btn btn-link btn-primary">Изменить</a>
                    <a href="{% url 'statuses_delete' status.id %}" class="btn btn-link btn-primary">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
{% endblock %}
