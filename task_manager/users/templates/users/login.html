{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="container mt-4">
    <h2>Вход</h2>
    <form method="post">
        {% csrf_token %}
        
        {% bootstrap_field form.username %}
        {% bootstrap_field form.password %}
        
        
        {% bootstrap_button "Войти" button_type="submit" %}
    </form>
</div>

{% endblock %}
