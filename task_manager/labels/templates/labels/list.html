{% extends 'base.html' %}
{% load django_bootstrap5 %}
{% block content %}
<div class="container mt-4">
    <h2>Статусы</h2>
    <a href="{% url 'labels_create' %}" class="btn btn-primary">Создать метку</a>
    <table class="table table-striped"> 
        <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Дата создания</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for label in labels %}
            <tr>
                <td>{{label.id}}</td>
                <td>{{label.name}}</td>
                <td>{{label.created_at|date:"d.m.Y H:i"}}</td>
                <td>
                    <a href="{% url 'labels_update' label.id %}" class="btn btn-link btn-primary">Изменить</a>
                    <a href="{% url 'labels_delete' label.id %}" class="btn btn-link btn-primary">Удалить</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
{% endblock %}
